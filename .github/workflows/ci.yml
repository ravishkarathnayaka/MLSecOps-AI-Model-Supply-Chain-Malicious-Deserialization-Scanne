name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Build, Lint & Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black httpx

      - name: Code style check (Black & Flake8)
        run: |
          black --check --diff scanner cli admission_gate tests test_models || true
          flake8 scanner cli admission_gate tests --count --max-line-length=120 --statistics || true

      - name: Generate synthetic test models
        run: |
          python test_models/generate_test_models.py

      - name: Run Pytest test suite with coverage
        run: |
          pytest tests/ -v --cov=scanner --cov-report=term-missing --cov-report=xml

      - name: Test CLI invocation
        run: |
          python -m cli.main --path test_models/safe_model.safetensors --format text
          python -m cli.main --path test_models/safe_model.safetensors --format json
          python -m cli.main --path test_models/safe_model.safetensors --format sarif --output scan_report.sarif
