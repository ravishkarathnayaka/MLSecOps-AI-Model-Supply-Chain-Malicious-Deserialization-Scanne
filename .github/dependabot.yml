version: 2
updates:
  # Maintain Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "python"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Maintain Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/admission_gate"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
